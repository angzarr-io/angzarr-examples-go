# Lefthook configuration
# https://github.com/evilmartians/lefthook
#
# Setup: lefthook install

post-checkout:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

post-merge:
  commands:
    install-submodule-hooks:
      run: just install-submodule-hooks

pre-commit:
  parallel: false
  commands:
    check-submodules-clean:
      # git exports GIT_DIR/GIT_INDEX_FILE to hooks in linked worktrees,
      # which would make `git -C <submodule>` inspect the parent instead.
      run: env -u GIT_DIR -u GIT_INDEX_FILE just check-submodules-clean
