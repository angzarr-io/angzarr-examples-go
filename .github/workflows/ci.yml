name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/angzarr-io/examples-go
  COORDINATOR_VERSION: v0.5.1
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

permissions:
  contents: read
  packages: write

jobs:
  # Unbypassable guard against `--no-verify` / `LEFTHOOK=0` locally. Mirrors
  # the parent-side check that lefthook runs on pre-commit. Pointer-only
  # bumps pass; dirty submodule working trees fail.
  submodules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Install just
        uses: extractions/setup-just@v2
      - name: Verify submodules are clean
        run: just check-submodules-clean

  # =============================================================================
  # STAGE 1: BUILD & TEST
  # =============================================================================

  test:
    name: Build & Test
    runs-on: ubuntu-latest
    needs: [submodules]
    container:
      image: ghcr.io/angzarr-io/angzarr-go:9e07ae0@sha256:b57cce65c7bc14aaa67845d94d0eb3c7f7bddae43190299ec8f02bb8e92ee6d8
      # The image's default user cannot write the runner's mounted dirs.
      options: --user root
      credentials:
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true  # non-recursive; nested vendor submodules are not needed

      - name: Configure git safe directory
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Build
        run: just -f justfile.container build

      - name: Test (unit)
        run: just -f justfile.container test-unit

      - name: Install golangci-lint
        run: |
          curl -sSfL https://raw.githubusercontent.com/golangci/golangci-lint/master/install.sh | sh -s -- -b /usr/local/bin v1.64.8

      - name: Lint
        run: just -f justfile.container lint

      - name: Format check
        run: |
          gofmt -l . | tee /tmp/gofmt.out
          test ! -s /tmp/gofmt.out

  # =============================================================================
  # SUMMARY
  # =============================================================================

  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [test]
    if: always()
    steps:
      - name: Check results
        run: |
          echo "## CI Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Job | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|-----|--------|" >> $GITHUB_STEP_SUMMARY
          echo "| Test | ${{ needs.test.result }} |" >> $GITHUB_STEP_SUMMARY

          if [ "${{ needs.test.result }}" != "success" ]; then
            echo "One or more required jobs failed"
            exit 1
          fi
